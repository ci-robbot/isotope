# The greeter declares Conflicts=getty@tty1, so it takes tty1 from the console
# login when it starts. When it fails for good (Restart=always gives up after
# StartLimitBurst), give tty1 back: without this the screen stays blank and
# there is no way to log in on it. A masked or disabled greeter needs nothing
# here: getty@tty1 is enabled, and nothing stops it.
# Lives under /usr/lib, not /etc, so the Kairos /etc overlay cannot shadow it.
[Unit]
OnFailure=getty@tty1.service
