# Portal backends for XDG_CURRENT_DESKTOP=COSMIC. This replaces the file
# xdg-desktop-portal-cosmic installs; the lines are its own, plus Settings.
# cosmic: every interface it implements (file chooser, screenshot, screen cast,
#   access, settings: org.freedesktop.appearance colour scheme, text scaling).
# gtk: after cosmic, so cosmic comes first for every setting both serve (the
#   colour scheme must follow COSMIC's dark/light, not gsettings). The GTK
#   backend adds what cosmic lacks, button-layout and icon-theme from the
#   Isotope gsettings overrides, which Flatpak GTK apps read through the
#   portal. It also serves the interfaces cosmic has none for (print, app
#   chooser, notification).
# xdg-desktop-portal merges all Settings backends; for a key more than one
# serves, the first listed wins.
[preferred]
default=cosmic;gtk;
org.freedesktop.impl.portal.Settings=cosmic;gtk;
org.freedesktop.impl.portal.Secret=oo7-portal;gnome-keyring;
