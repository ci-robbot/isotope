# Point the Kairos auto-installer at the Isotope AGENT appliance installer.
#
# This is the INTERACTIVE install path: when the appliance ISO is booted to
# install, the Kairos installer service owns tty1 and normally runs the desktop
# wizard (rootfs/common/system/oem/90_desktop_installer.yaml drops 10-desktop.conf).
# This stage (91, same initramfs stage) drops a SECOND override -- 20-agent.conf,
# which sorts AFTER 10-desktop.conf so it wins -- replacing the ExecStart with
# /usr/local/bin/isotope-agent-install. That script asks hostname + disk, shows
# the exact device in RED, and only wipes the disk after the operator types
# `yes`.
#
# Guards: an install sentinel from immucore, /run/cos/install_mode
# (kairos-installer.service) or /run/cos/install_mode_interactive
# (kairos-interactive.service), so it can NEVER touch a normally-booted or live
# system; AND the /etc/isotope-agent/profile marker, so it is a hard no-op on
# any image that is not the agent appliance overlay. See 90_desktop_installer.yaml
# for how immucore decides the sentinels.
name: "Isotope agent appliance installer UI"
stages:
  initramfs:
    - if: '[ -f /run/cos/install_mode ] && [ -f /etc/isotope-agent/profile ]'
      name: "point kairos-installer at the Isotope agent installer"
      files:
        - path: /etc/systemd/system/kairos-installer.service.d/20-agent.conf
          permissions: 0644
          owner: 0
          group: 0
          content: |
            [Service]
            ExecStart=
            ExecStart=/usr/local/bin/isotope-agent-install
      commands:
        - systemctl daemon-reload
    - if: '[ -f /run/cos/install_mode_interactive ] && [ -f /etc/isotope-agent/profile ]'
      name: "point kairos-interactive at the Isotope agent installer"
      files:
        - path: /etc/systemd/system/kairos-interactive.service.d/20-agent.conf
          permissions: 0644
          owner: 0
          group: 0
          content: |
            [Service]
            ExecStart=
            ExecStart=/usr/local/bin/isotope-agent-install
      commands:
        - systemctl daemon-reload
