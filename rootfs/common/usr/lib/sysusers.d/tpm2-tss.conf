# The tss user and group, which the TPM udev rules give /dev/tpm0 and
# /dev/tpmrm0 to (tpm-udev.rules, ltt2go-udev.rules). The Hadron base installs
# those rules with tpm2-tss but not tpm2-tss' own sysusers file, so udev logged
# "Failed to resolve user 'tss'" and the TPM devices stayed root-only. This is
# tpm2-tss' dist/sysusers.d/tpm2-tss.conf.not-fully-locked, under the name
# dracut's 73tpm2-tss module looks for (inst_sysusers tpm2-tss.conf).
#Type Name ID GECOS               Home directory Shell
u     tss  -  "tss user for tpm2"
