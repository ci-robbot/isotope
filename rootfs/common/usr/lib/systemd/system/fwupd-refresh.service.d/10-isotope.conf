# The same markers as the timer (10-isotope.conf there), so a refresh started
# by hand or by Persistent= on a live or install boot does nothing.
[Unit]
ConditionPathExists=!/run/cos/live_mode
ConditionPathExists=!/run/cos/install_mode
ConditionPathExists=!/run/cos/uki_install_mode
ConditionPathExists=!/run/isotope/live-desktop

# Not on a metered connection, as automatic updates: `isotope unmetered`
# reads NetworkManager's Metered (yes or guess-yes skips; no NetworkManager,
# as on a server without it, runs) and exits 1 to skip the refresh.
[Service]
ExecCondition=/usr/bin/isotope unmetered
