# Isotope refreshes the LVFS firmware metadata once a day (fwupd's own timer
# is hourly), and only on an installed system: never on the live media,
# during an install or on the Trusted Boot medium (the firewall's markers,
# and the live desktop's own). The timer is enabled in the image
# (desktop-default, server-default). See
# docs/superpowers/specs/2026-11-24-firmware-updates-design.md.
[Unit]
ConditionPathExists=!/run/cos/live_mode
ConditionPathExists=!/run/cos/install_mode
ConditionPathExists=!/run/cos/uki_install_mode
ConditionPathExists=!/run/isotope/live-desktop

[Timer]
OnCalendar=
OnCalendar=daily
RandomizedDelaySec=1h
Persistent=true
