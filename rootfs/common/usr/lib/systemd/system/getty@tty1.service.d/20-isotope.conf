# The login screen (ly@tty1, cosmic-greeter) conflicts with getty@tty1, and
# its OnFailure= starts getty@tty1 again (20-getty-fallback.conf). A login
# screen that keeps crashing restarts a few times before it gives up, and each
# round stops and starts getty here, which used up getty's start limit: the
# last start, the one that should leave a login prompt, was refused.
# Lives under /usr/lib, not /etc, so the Kairos /etc overlay cannot shadow it.
[Unit]
StartLimitIntervalSec=0
