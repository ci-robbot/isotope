# Start a serial getty only on a port that has a UART. The kernel command line
# has console=ttyS0 on every boot entry (Kairos' GRUB config), so
# systemd-getty-generator starts serial-getty@ttyS0 on every computer. On a
# laptop with no legacy serial port, ttyS0 is an empty 8250 slot: agetty fails
# with "failed to get terminal attributes: I/O error" after 10 seconds and
# Restart=always starts it again for the whole uptime. When the condition fails
# the unit is skipped, not failed, and is not restarted. Ports with a UART
# (QEMU's -serial, servers, IPMI and AMT serial-over-LAN that the kernel found)
# keep their getty.
[Service]
ExecCondition=/usr/libexec/isotope-serial-present %I
