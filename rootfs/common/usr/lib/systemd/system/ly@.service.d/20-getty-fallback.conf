# ly declares Conflicts=getty@%i, so it takes the VT from the console login
# when it starts. When ly fails for good, give the VT back: without this the
# screen stays blank and there is no way to log in on it. A masked or
# disabled ly needs nothing here: getty@tty1 is enabled, and nothing stops it.
# Lives under /usr/lib, not /etc, so the Kairos /etc overlay cannot shadow it.
[Unit]
OnFailure=getty@%i.service
