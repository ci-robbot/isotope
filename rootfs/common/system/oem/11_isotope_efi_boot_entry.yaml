# A UEFI boot entry for the installed disk.
#
# kairos-agent puts shim and GRUB on the ESP only at the removable-media path,
# \EFI\BOOT\BOOTX64.EFI, and writes no Boot#### variable. A firmware whose boot
# list still names an earlier system (an "ubuntu" entry on a partition the
# install just erased, a Windows Boot Manager on another disk) can try those and
# never boot the new disk. `isotope efi-boot-entry` writes an "Isotope" entry
# for the ESP the install just wrote and puts it first in BootOrder; see
# cmd/isotope/efiboot.go.
#
# after-install runs inside `kairos-agent install`, after the system is on the
# disk and while the ESP is still mounted at /run/cos/efi, so every install
# path gets it: the wizard, an unattended install and the agent appliance.
#
# Only on a machine that booted with UEFI, and not on a Trusted Boot (UKI)
# install, which boots systemd-boot through its own entries. A firmware that
# refuses the write still boots the removable-media path, so a failure here
# warns and never fails the install.
name: "Isotope UEFI boot entry"
stages:
    after-install:
    - name: "Add an Isotope UEFI boot entry"
      if: '[ -d /sys/firmware/efi/efivars ] && grep -vq "rd.immucore.uki" /proc/cmdline'
      commands:
      - /usr/bin/isotope efi-boot-entry || echo "isotope efi-boot-entry failed; the firmware can still boot the removable-media path"
