# Where `isotope-ext` (the update service) looks for system extensions.
# One catalog=URL per line, searched in order: the first catalog that
# publishes a name wins. A catalog is a JSON file in the Kairos format
# (kairos-io/kairos sdk/extensions/catalog.go). Without a valid line, the
# two catalogs below are used.
#
# Isotope's own extensions, built from extensions/ in the Isotope repository
# on the same Hadron release as this system.
catalog=https://kairos-community.github.io/isotope/extensions.json
# Hadron's layers (kairos-io/hadron-layers), the catalog Kairos defaults to.
catalog=https://kairos-io.github.io/hadron-layers/releases.json
