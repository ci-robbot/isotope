# Isotope: how udisks2 mounts an NTFS disk (Isotope System's Disks page, a
# file manager). udisks2 2.12's built-in defaults already try the kernel's
# ntfs3 driver first and then the legacy "ntfs" driver, which left the
# kernel in 6.9; Hadron's kernel has ntfs3 (fs/ntfs3), loaded on demand
# through its fs-ntfs3 alias. So ntfs3 is the only driver, and
# windows_names keeps file names that Windows could not open off the disk.
# The rest of udisks2's built-in options stay as they are.
# See https://storaged.org/udisks/docs/mount_options.html

[defaults]
ntfs_drivers=ntfs3
ntfs:ntfs3_defaults=uid=$UID,gid=$GID,windows_names
