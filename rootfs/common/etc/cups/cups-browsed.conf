# Isotope's cups-browsed settings. See "man cups-browsed.conf".
#
# cups-browsed makes a queue only for an IPP-over-USB printer that ipp-usb
# publishes on this computer (LocalOnly): plugged in, it prints, from every
# app. Network printers are added in Isotope System's Printers page (or with
# lpadmin), so a queue an administrator removes stays removed: with
# CreateIPPPrinterQueues Driverless, cups-browsed made a queue for every
# network printer and made it again right after a Remove. GTK apps also
# list the network printers directly, through libcups and Avahi.

BrowseRemoteProtocols dnssd
BrowseLocalProtocols none

CreateIPPPrinterQueues LocalOnly

# Shared queues of other CUPS servers come through DNS-SD as IPP printers,
# which the page adds like any other: no queues made for them here either.
CreateRemoteCUPSPrinterQueues No

# musl cannot resolve .local names (no NSS, so no nss-mdns): give the queues
# the printer's address instead of its mDNS host name.
IPBasedDeviceURIs IPv4
