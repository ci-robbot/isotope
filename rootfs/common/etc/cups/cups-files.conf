# Isotope's CUPS file and directory settings. See "man cups-files.conf".

# The printers (printers.conf, classes.conf, ppd/, ssl/, subscriptions.conf)
# live here, not in /etc/cups: Kairos rebuilds /etc at every boot, while
# /var/lib/cups is bind-mounted from the persistent partition
# (/system/oem/94_isotope_state.yaml). cupsd still reads cupsd.conf and this
# file from /etc/cups, so they follow the image on every upgrade.
# test/printing/check-printing.sh checks both ends.
ServerRoot /var/lib/cups

# Filters and backends run as lp, never as root.
User lp
Group lp

# @SYSTEM in cupsd.conf: root, and the admin group, so an administrator can
# also use lpadmin in a terminal. Everyone else gets CUPS's own refusal.
SystemGroup root admin
PeerCred on

# The journal, not files: /var/log is rebuilt at every boot too.
AccessLog syslog
ErrorLog syslog
PageLog syslog
