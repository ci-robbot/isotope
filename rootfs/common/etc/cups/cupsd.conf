# Isotope's CUPS scheduler settings. See "man cupsd.conf".
#
# This file and cups-files.conf come from the image at every boot (Kairos
# rebuilds /etc), so a change made here, or with cupsctl or CUPS's web page
# admin settings, is lost at the next boot. The printers themselves live in
# /var/lib/cups (ServerRoot in cups-files.conf), which is kept on the
# persistent partition (/system/oem/94_isotope_state.yaml).

LogLevel warn
MaxLogSize 0
ErrorPolicy retry-job

# Only this computer: CUPS's socket and localhost. The firewall drops 631
# from the network anyway, and nothing here is shared.
Listen localhost:631
Listen /run/cups/cups.sock

# Do not announce this computer's printers on the network. Printers on the
# network are found by cups-browsed and by the apps through Avahi, which
# needs no Browsing here.
Browsing No
DefaultShared No

DefaultAuthType Basic

# The web interface at http://localhost:631 for the settings Isotope System
# does not have; its admin pages ask an administrator's password (PAM).
WebInterface Yes

# cups.service starts cupsd at boot and cups-browsed keeps a subscription on
# it: do not exit when idle.
IdleExitTimeout 0

<Location />
  Order allow,deny
</Location>

<Location /admin>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
</Location>

<Location /admin/log>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
</Location>

# CUPS's default policy. @SYSTEM is SystemGroup in cups-files.conf: root and
# admin. Isotope System adds and removes printers through isotope-updated,
# which runs lpadmin as root after polkit said yes.
<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscriptions Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Get-Document>
    AuthType Default
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Cancel-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Authenticate-Job>
    AuthType Default
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
