# ly is wired into multi-user.target (Kairos forces `set-default multi-user.target`,
# so graphical.target is never reached). multi-user.target is also reached while
# the installer runs from the ISO, and ly would grab tty1, which the installer
# needs. So ly does not start when an install runs: immucore writes
# /run/cos/install_mode (an unattended install) or /run/cos/install_mode_interactive
# (the installer window) in that case. It does start on the live desktop (the
# ISO booted without an install config), where it logs in the user `live`; the
# live twin in 91_desktop_session.yaml starts it there. Both install guards are
# needed: install_mode alone would let ly in during the interactive installer.
# /run/cos/live_mode is set on every ISO boot, so alone it cannot tell the live
# desktop from the "debug" and "boot local node from livecd" entries: the
# triggering pair below lets ly start on an installed system or on the live
# desktop only.
[Unit]
ConditionPathExists=!/run/cos/install_mode
ConditionPathExists=!/run/cos/install_mode_interactive
# A triggering pair (the `|` conditions are ORed, and ANDed with the guards
# above): an installed system (no /run/cos/live_mode), or the live desktop (the
# marker). An ISO boot with no marker, such as "debug" or "boot local node
# from livecd", starts neither, as before.
ConditionPathExists=|!/run/cos/live_mode
ConditionPathExists=|/run/isotope/live-desktop

# /etc is rebuilt at every boot, and the users from the install config are
# created again by the Kairos boot stage (cos-setup-boot.service). ly reads its
# user list from /etc/passwd once, when it starts, so it must start after that
# stage, or the installed user can be missing from the list. (ly shows login
# names, not GECOS, so the display name does not matter here.)
After=cos-setup-boot.service
