# bluetoothd settings. Only what differs from BlueZ's defaults is set here.
[General]
# LE Audio (BAP, BASS, MCP, CSIP) is still experimental in BlueZ 5.79: its
# profiles carry the experimental flag and register only when bluetoothd runs
# with Experimental on. Without it, LE Audio headphones pair but do not stream.
# This also turns on BlueZ's other experimental D-Bus interfaces, not only LE Audio.
Experimental = true
# bluetoothd opens ISO sockets (LE Audio streams) only when the kernel's ISO
# socket feature is on. This UUID turns on that feature and nothing else.
KernelExperimental = 6fbaf188-05e0-496a-9885-d6ddfdb4e03e
