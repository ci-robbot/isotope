# greetd runs cosmic-greeter, COSMIC's graphical login screen, on tty1.
# cosmic-greeter.service passes this file to greetd.
[terminal]
vt = 1

[general]
# PAM service for the user's session (rootfs-cosmic/etc/pam.d/cosmic-greeter).
service = "cosmic-greeter"

[default_session]
# isotope-greeter-start runs cosmic-greeter-start with software rendering
# when Mesa has no working driver for the GPU (/usr/libexec/isotope-gpu-env).
command = "isotope-greeter-start"
user = "cosmic-greeter"
