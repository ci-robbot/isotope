# fuzzel on COSMIC (the Isotope menu picker): overrides rootfs/etc/xdg/fuzzel/
# fuzzel.ini, which the Sway and niri images keep. Styled on COSMIC: Inter, a
# large corner radius, roomy padding and rows, a translucent background like
# the frosted top bar, and the theme accent for the selected row.
# fuzzel cannot follow COSMIC's day/night switch, so this is the night palette.
# fuzzel 1.11 has no selection-radius key, so the selected row is a plain
# rectangle inside the rounded window, not a rounded chip.
# Colours: generated from theme/palette.toml by tools/gen-theme.py.
font=Inter Variable:size=12
dpi-aware=auto
icon-theme=Conflux
prompt=">  "
lines=12
width=38
horizontal-pad=24
vertical-pad=20
inner-pad=12
line-height=26
letter-spacing=0

[colors]
background=141411d9
text=f4f5f2ff
prompt=f4f5f2ff
match=e9e7c1ff
selection=e9e7c1ff
selection-text=141411ff
selection-match=141411ff
border=393a34ff

[border]
width=1
radius=18
