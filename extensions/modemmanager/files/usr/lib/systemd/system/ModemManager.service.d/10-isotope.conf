# Isotope: ModemManager.service comes from the modemmanager extension and is
# started at boot by its link in multi-user.target.wants, which the boot's
# systemd-sysext merge adds before sysinit.target. NetworkManager does not
# start it (it never D-Bus-activates ModemManager on a systemd system) and
# needs no order against it: it follows the name's owner and adds the modems
# when ModemManager appears. So no After= or Wants= on NetworkManager, which
# would only delay the network by this unit's udev settle.
#
# The extension's udev rules (77-mm-*, 80-mm-candidate) can be merged after
# the boot's coldplug, and are new to udevd when the extension is enabled on
# a running system. ModemManager ignores a port without ID_MM_CANDIDATE, so
# reload the rules and replay the modem subsystems first: tty, usbmisc
# (cdc-wdm) and wwan. Not net: every interface would get a change event, and
# ModemManager probes a modem's network port again from its control port.
# "+": outside the unit's sandbox; "-": a failure here does not keep
# ModemManager from starting.
[Unit]
After=systemd-sysext.service systemd-udev-trigger.service

[Service]
ExecStartPre=-+/usr/bin/udevadm control --reload
ExecStartPre=-+/usr/bin/udevadm trigger --action=change --subsystem-match=tty --subsystem-match=usbmisc --subsystem-match=wwan
ExecStartPre=-+/usr/bin/udevadm settle --timeout=10
