<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Isotope's policy for ModemManager, which is built without polkit.
     Upstream's no-polkit policy lets every user call it, and a modem holds
     the SMS messages and the location. Here only root (NetworkManager, which
     the Network page and the network menus go through) and members of the
     admin group may call it or receive its signals: an incoming SMS comes
     with its text in an InterfacesAdded signal, and the location in
     PropertiesChanged, which the system bus otherwise delivers to any
     connection that asks. -->
<busconfig>
  <policy context="default">
    <deny receive_sender="org.freedesktop.ModemManager1"/>
  </policy>
  <policy user="root">
    <allow own="org.freedesktop.ModemManager1"/>
    <allow send_destination="org.freedesktop.ModemManager1"/>
    <allow receive_sender="org.freedesktop.ModemManager1"/>
  </policy>
  <policy group="admin">
    <allow send_destination="org.freedesktop.ModemManager1"/>
    <allow receive_sender="org.freedesktop.ModemManager1"/>
  </policy>
</busconfig>
