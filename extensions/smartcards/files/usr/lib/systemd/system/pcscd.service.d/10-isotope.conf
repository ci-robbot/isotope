# Isotope: pcscd runs as root with no capabilities, not as the pcscd user.
# Kairos builds /etc again at every boot, so a system user an extension
# brings would not exist when udev sets up a reader at boot (CCID's rule
# gives the reader to the pcscd group), and an extension cannot add one
# before that. Root with an empty capability set (upstream's
# CapabilityBoundingSet=) opens the root-owned USB device nodes and nothing
# more; the rest of upstream's sandbox stays. Which users may use a reader is
# polkit's answer (50-isotope-pcscd.rules). See
# docs/superpowers/specs/2026-11-24-smartcards-design.md.
[Service]
User=
