# Agent appliance Ly profile.
#
# The base image gates Ly (10-conditions.conf): not while an install runs, and
# only on an installed system or on the live desktop (the marker
# /run/isotope/live-desktop), so Ly never grabs tty1 on the other ISO entries or
# during the installer. The agent appliance, by contrast, is meant to
# auto-login the locked `agent` account and bring up the XLibre/i3 session even
# on a LIVE agent boot -- that live session is where Cua attaches. So this
# drop-in (sorted after 10-conditions.conf) CLEARS the inherited conditions,
# the triggering `|` ones included (an empty ConditionPathExists= resets every
# one of them; ConditionKernelCommandLine= too, for an older base drop-in) and
# sets ONLY the
# install guard: no immucore install sentinel (/run/cos/install_mode,
# /run/cos/install_mode_interactive). Never fight the installer for tty1, but do
# allow the live agent login.
#
# The Ly autologin values themselves -- auto_login_user=agent,
# auto_login_session=i3, auto_login_service=ly-autologin -- are written into
# /etc/ly/config.ini by the agent provisioning/OEM path (system/oem/90_agent_profile.yaml),
# not here; this file only owns the systemd start conditions.
[Unit]
ConditionPathExists=
ConditionKernelCommandLine=
ConditionPathExists=!/run/cos/install_mode
ConditionPathExists=!/run/cos/install_mode_interactive
