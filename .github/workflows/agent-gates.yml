name: Agent Gates

on:
  pull_request:
    # A pull request that touches none of these never starts this workflow.
    # Dockerfile and Makefile are shared with the desktops, so the scope job
    # below then decides whether the change reaches the agent at all.
    paths:
      - "cmd/isotope-agent/**"
      - "internal/agent/**"
      - "go.mod"
      - "go.sum"
      - "rootfs/agent/**"
      - "Dockerfile.agent"
      - "test/agent/**"
      - "cmd/isotope-install-ui/**"
      - "pkg/installer/**"
      - "test/boot-ux/**"
      - "rootfs/common/etc/kairos/branding/**"
      - "auroraboot/**"
      - "Dockerfile"
      - "Makefile"
      - ".github/workflows/agent-gates.yml"
  workflow_dispatch:
  schedule:
    # Nightly full agent sweep at 03:17 UTC, off the top of the hour so the
    # run does not queue behind every other cron-triggered workflow.
    - cron: "17 3 * * *"

concurrency:
  group: agent-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Every VM gate resolves its appliance image through this variable
  # (`test/agent/run.sh` uses `${1:-${AGENT_IMAGE:-agent-desktop:dev}}`, and the
  # Makefile declares `AGENT_IMAGE ?= agent-desktop:dev`), so one value keeps
  # the build job and the gates on the exact same tag.
  AGENT_IMAGE: agent-desktop:dev

jobs:
  # Agent Gates takes about three hours, and most Dockerfile and Makefile
  # changes are desktop-only (sway, cosmic, niri). On a pull request, compare
  # scripts/agent-input-key.sh of the merge commit with that of its base: the
  # key hashes the `make agent-iso` commands, the Dockerfile stages the i3
  # image reaches, the agent stage of Dockerfile.agent, the files those stages
  # read, and the gate harness. The same key means the same agent image and
  # the same gates, so the build and the gates are skipped (a job skipped by
  # its `if:` reports success). The nightly schedule and a manual dispatch
  # always run everything, and so does any failure to compute a key.
  scope:
    name: Decide whether the agent changed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The merge commit and its parents: HEAD^1 is the base branch.
          fetch-depth: 2

      - name: Compare the agent input keys
        id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          decide() {
            echo "run=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
            echo "$2" >> "$GITHUB_STEP_SUMMARY"
          }
          if [[ "$EVENT" != pull_request ]]; then
            decide true "Running every gate: $EVENT event."
            exit 0
          fi
          # A pull_request checkout is the merge commit of the pull request
          # into its base; without a second parent there is no base to compare.
          if ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            decide true "Running every gate: HEAD is not a merge commit."
            exit 0
          fi
          base_tree="$RUNNER_TEMP/base"
          git worktree add --detach "$base_tree" HEAD^1
          # This tree's key script computes both keys, so a change to the
          # script itself does not count as an agent change.
          if ! base_key="$(scripts/agent-input-key.sh "$base_tree")" \
             || ! head_key="$(scripts/agent-input-key.sh .)"; then
            decide true "Running every gate: could not compute the agent input key."
            exit 0
          fi
          if [[ "$base_key" == "$head_key" ]]; then
            decide false "Skipping the agent build and gates: the agent inputs did not change ($head_key)."
          else
            decide true "Running every gate: the agent inputs changed ($base_key -> $head_key)."
          fi

  # The agent's unit tests (cmd/isotope-agent, internal/agent), the harness shell parse, and the hermetic browser
  # unit tests run in ci.yml on every pull request; this workflow only builds
  # the appliance and runs the VM gates on it.
  build-agent-iso:
    name: Build agent image and ISO
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    env:
      # Registry build cache (see CACHE_REF in the Makefile): buildcache-i3
      # and buildcache-agent, written by release.yml and by the nightly and
      # manual runs here. The package is public, so pull requests, fork ones
      # included, read it without a login. A pull request from a branch of
      # this repository also writes its own pr<number> refs (CACHE_SCOPE),
      # which only its next run reads; a fork's token cannot write.
      CACHE_REF: ghcr.io/${{ github.repository }}:buildcache
      CACHE_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      CACHE_SCOPE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && format('pr{0}', github.event.pull_request.number) || '' }}

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Standard GitHub-hosted Linux runners expose 14 GB of SSD. Remove large
      # preinstalled SDKs that this Docker-only build does not use so BuildKit
      # has room for the source-build stages.
      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          docker system prune --all --force
          df -h /

      - name: Use the containerd image store
        shell: bash
        run: scripts/ci-containerd-store.sh

      - name: Log in to GHCR
        if: env.CACHE_PUSH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The agent image is built on i3, whose Mesa links libLLVM (llvmpipe).
      # Use the LLVM image release.yml publishes for this tree's llvm stage
      # (`make print-llvm-tag`). Without one, the build compiles LLVM itself,
      # which takes about three hours.
      - name: Use the prebuilt LLVM
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}:$(make -s print-llvm-tag)"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "Using $image"
            echo "LLVM_IMAGE=$image" >> "$GITHUB_ENV"
          else
            echo "::warning::No $image; compiling LLVM in this job"
          fi

      - name: Build agent ISO
        shell: bash
        run: |
          set -euo pipefail
          make agent-iso

      - name: First-boot Chromium units present in the image
        shell: bash
        run: |
          set -euo pipefail
          # make agent-iso builds agent-desktop:dev; assert the install/launch
          # units and the signed Flathub descriptor they need shipped and are
          # enabled in it.
          test/agent/browser_units_test.sh agent-desktop:dev

      # The appliance has no Isotope Welcome and nothing that starts it.
      - name: No Isotope Welcome in the image
        shell: bash
        run: test/welcome/check-welcome-image.sh agent-desktop:dev agent

      - name: No Isotope System in the image
        shell: bash
        run: test/system/check-system-image.sh agent-desktop:dev agent

      # The VM gates do not boot this ISO directly: each of them re-wraps the
      # appliance OCI image with its own freshly minted `cidata` seed. So the
      # single build is exported twice -- as the OCI image the gates consume and
      # as the ISO artifact this workflow publishes as evidence -- and no
      # downstream job ever rebuilds the appliance.
      - name: Export the agent image and ISO
        shell: bash
        run: |
          set -euo pipefail

          iso_dir="build/agent-desktop/iso"
          mapfile -t isos < <(find "$iso_dir" -maxdepth 1 -type f -name '*.iso' -print)
          if (( ${#isos[@]} != 1 )); then
            echo "Expected exactly one ISO in $iso_dir, found ${#isos[@]}" >&2
            exit 1
          fi

          mkdir -p dist
          cp "${isos[0]}" dist/isotope-agent-amd64.iso
          docker save "$AGENT_IMAGE" | zstd -T0 -3 -o dist/agent-image.tar.zst
          cd dist
          sha256sum isotope-agent-amd64.iso > isotope-agent-amd64.iso.sha256
          sha256sum agent-image.tar.zst > agent-image.tar.zst.sha256

          # The export is on disk now; drop the build cache so the upload has
          # room to stage its own copy.
          docker builder prune --all --force
          df -h /

      - name: Upload the agent image
        uses: actions/upload-artifact@v7
        with:
          name: agent-image
          path: |
            dist/agent-image.tar.zst
            dist/agent-image.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload the agent ISO
        uses: actions/upload-artifact@v7
        with:
          name: agent-iso
          path: |
            dist/isotope-agent-amd64.iso
            dist/isotope-agent-amd64.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The five VM gates only consume the image build-agent-iso uploaded, and
  # each one boots its own VM on its own runner, so they run side by side.
  # fail-fast is off: one red gate must not cancel the evidence of the others.
  gates:
    name: ${{ matrix.name }}
    needs: build-agent-iso
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          # Builds only its probe-instrumented test image
          # (test/agent/Dockerfile.compat) on top of the loaded agent image.
          - gate: compatibility
            name: Native compatibility gate
          # Boots the appliance live against a blank disk and proves the eight
          # public MCP tools plus the privilege boundaries, without writing to
          # the attached disk.
          - gate: contract
            name: MCP and privilege contract gate
          - gate: install
            name: Zero-touch install gate
          - gate: recovery
            name: Recovery and emergency pause gate
          # Drives the GTK reference app and the pinned Chromium Flatpak in the
          # visible XLibre session through public computer_use only.
          - gate: ui
            name: GTK and Chromium UI gate

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Standard GitHub-hosted Linux runners expose 14 GB of SSD. Remove large
      # preinstalled SDKs that the gates do not use so the loaded image, the
      # gate's own ISO, and its VM disks fit.
      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          docker system prune --all --force
          df -h /

      - name: Install agent VM dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            jq \
            novnc \
            ovmf \
            python3-pil \
            qemu-system-x86 \
            qemu-utils \
            websockify \
            xorriso
          # The harness picks KVM when /dev/kvm is readable and falls back to
          # multi-threaded TCG otherwise; make the fast path usable when the
          # runner image exposes nested virtualisation.
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download the agent image
        uses: actions/download-artifact@v8
        with:
          name: agent-image
          path: dist

      - name: Load the agent image
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check agent-image.tar.zst.sha256
          zstd -d --stdout agent-image.tar.zst | docker load
          docker image inspect "$AGENT_IMAGE" >/dev/null
          # The compressed export is loaded now; free its space for the gate.
          rm -f agent-image.tar.zst

      - name: Run the ${{ matrix.gate }} gate
        shell: bash
        env:
          GATE: ${{ matrix.gate }}
        run: |
          set -euo pipefail
          test/agent/run.sh "$GATE" "$AGENT_IMAGE"

      # Only test/agent/artifacts is ever uploaded. test/agent/runtime holds
      # bearer plaintext, seeds, and descriptors and must never leave the runner.
      - name: Upload ${{ matrix.gate }} diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-diagnostics-${{ matrix.gate }}
          path: test/agent/artifacts/${{ matrix.gate }}
          if-no-files-found: warn
          retention-days: 7

  # One check with a fixed name that sums up the run, for a branch rule to
  # require: it passes when the build and every gate passed, or when the scope
  # job skipped them all. The matrix checks have no stable name when skipped,
  # and a pull request that matches none of the `paths:` above gets no check
  # at all, so require this one only together with a rule that allows that.
  result:
    name: Agent Gates result
    needs: [scope, build-agent-iso, gates]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the build and the gates
        shell: bash
        env:
          SCOPE: ${{ needs.scope.result }}
          RUN: ${{ needs.scope.outputs.run }}
          BUILD: ${{ needs.build-agent-iso.result }}
          GATES: ${{ needs.gates.result }}
        run: |
          set -euo pipefail
          echo "scope=$SCOPE run=$RUN build=$BUILD gates=$GATES"
          [[ "$SCOPE" == success ]] || { echo "the scope job did not succeed" >&2; exit 1; }
          if [[ "$RUN" == true ]]; then
            [[ "$BUILD" == success && "$GATES" == success ]] || { echo "the agent build or a gate did not pass" >&2; exit 1; }
          else
            [[ "$BUILD" == skipped && "$GATES" == skipped ]] || { echo "expected the build and the gates to be skipped" >&2; exit 1; }
          fi
